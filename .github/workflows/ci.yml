name: CI

on:
  push:
    branches:
      - develop
      - "sprint-**"
  pull_request:
    branches:
      - develop

env:
  PYTHON_VERSION: "3.13"
  SQL_SUCCESS_MIN: "0.95"
  HALLUCINATION_MAX: "0.05"
  RAG_PRECISION_MIN: "0.70"
  # Real secrets injected from GitHub repository secrets — never hardcode
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ERP_PG_HOST: ${{ secrets.ERP_PG_HOST }}
  ERP_PG_PORT: ${{ secrets.ERP_PG_PORT }}
  ERP_PG_DATABASE: ${{ secrets.ERP_PG_DATABASE }}
  ERP_PG_USER: ${{ secrets.ERP_PG_USER }}
  ERP_PG_PASSWORD: ${{ secrets.ERP_PG_PASSWORD }}

# ──────────────────────────────────────────────────────────────────────────────
# Job graph
#
#   lint ──────────────────────────┬──────────────────────────────────────────┐
#     └── unit-tests               └── integration-tests                      │
#           └── performance-tests        └── performance-tests (shared gate)  │
#                 └── sql-benchmark (skip if secrets absent)                  │
#                 └── rag-benchmark (skip if secrets absent)                  │
# ──────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Lint & type check ────────────────────────────────────────────────────
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check src/ evaluation/ helpers/

      - name: Type check (mypy)
        run: mypy src/ evaluation/ helpers/ --ignore-missing-imports

  # ── 2. Unit tests + coverage gate ───────────────────────────────────────────
  unit-tests:
    name: Unit tests (coverage ≥ 80%)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest src/tests/unit/ -v \
            --cov=src \
            --cov=evaluation \
            --cov=helpers \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ── 3. Integration tests ─────────────────────────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest src/tests/integration/ -v --tb=short

  # ── 4. Performance tests ─────────────────────────────────────────────────────
  performance-tests:
    name: Performance tests (latency budgets)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run performance tests
        run: |
          pytest src/tests/performance/ -v --tb=short

  # ── 5. SQL benchmark gate ────────────────────────────────────────────────────
  # Requires ERP PostgreSQL + OpenAI. Skips gracefully when secrets are absent
  # (local dev / forks). Hard failure when secrets are present and gate fails.
  sql-benchmark:
    name: SQL benchmark gate (≥ 95% success)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SQL benchmark
        env:
          ERP_PG_HOST: ${{ secrets.ERP_PG_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$ERP_PG_HOST" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::ERP_PG_HOST or OPENAI_API_KEY not configured — skipping SQL benchmark"
            exit 0
          fi
          python evaluation/benchmarks/sql_benchmark.py || exit 1

  # ── 6. RAG benchmark gate ────────────────────────────────────────────────────
  # Requires OpenAI. Skips gracefully when secrets are absent.
  rag-benchmark:
    name: RAG benchmark gate (precision ≥ 70%)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RAG benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY not configured — skipping RAG benchmark"
            exit 0
          fi
          python evaluation/benchmarks/rag_benchmark.py || exit 1
