name: CI

on:
  push:
    # "sprint-*/" never matched anything: a branch glob's * does not cross "/",
    # and the trailing slash is not a valid pattern. Sprint branches ran no CI.
    branches:
      - develop
      - main
      - "sprint-*/**"
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    # PRs into a sprint integration branch are the normal review unit here,
    # so they have to be gated too — not just PRs that target develop.
    branches:
      - develop
      - main
      - "sprint-*/**"

env:
  PYTHON_VERSION: "3.13"
  SQL_SUCCESS_MIN: "0.95"
  HALLUCINATION_MAX: "0.05"
  RAG_PRECISION_MIN: "0.70"
  # Real secrets injected from GitHub repository secrets — never hardcode
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ERP_PG_HOST: ${{ secrets.ERP_PG_HOST }}
  ERP_PG_PORT: ${{ secrets.ERP_PG_PORT }}
  ERP_PG_DATABASE: ${{ secrets.ERP_PG_DATABASE }}
  ERP_PG_USER: ${{ secrets.ERP_PG_USER }}
  ERP_PG_PASSWORD: ${{ secrets.ERP_PG_PASSWORD }}

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check src/ evaluation/ helpers/

      - name: Type check (mypy)
        run: mypy src/ evaluation/ helpers/ --ignore-missing-imports

  unit-tests:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Integration tests run in-memory (Celery eager mode, in-memory stores)
      # and need no services. Running unit tests alone measured 70% coverage
      # against an 80% floor, so this gate could never pass; together they
      # measure 95% and, more importantly, actually exercise the routes and
      # middleware where this sprint's regressions were found.
      - name: Run unit and integration tests with coverage
        run: |
          pytest src/tests/unit/ src/tests/integration/ -v \
            --cov=src \
            --cov=evaluation \
            --cov=helpers \
            --cov-report=term-missing \
            --cov-fail-under=80

  sql-benchmark:
    name: SQL benchmark gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SQL benchmark
        run: python evaluation/benchmarks/sql_benchmark.py || exit 1

  rag-benchmark:
    name: RAG benchmark gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RAG benchmark
        run: python evaluation/benchmarks/rag_benchmark.py || exit 1
