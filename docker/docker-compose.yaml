# docker-compose.yaml — ERP Agentic RAG local development stack
#
# Services:
#   app        — FastAPI application (src/main.py)
#   worker     — Celery async worker
#   mongodb    — Primary document store (assets, chunks, query logs)
#   milvus     — Vector store for RAG embeddings
#   etcd       — Metadata store required by Milvus
#   minio      — S3-compatible asset file storage
#   redis      — Celery broker + result backend
#   prometheus — Metrics scraper (scrapes app:8000/metrics)
#
# Usage (from the repository root):
#   docker compose -f docker/docker-compose.yaml up -d
#   docker compose -f docker/docker-compose.yaml logs -f app
#   docker compose -f docker/docker-compose.yaml down -v
#
# Environment:
#   Copy .env.example to .env at the repository root and fill in secrets.
#   Never commit a populated .env file.
#
#   Compose resolves ${VAR} against a .env sitting next to THIS file, not the
#   repository root, so the app and worker services declare `env_file: ../.env`
#   to load the project's own. It is marked optional so the stack still starts
#   from a fresh clone with no .env yet — services then fall back to the
#   in-memory and synthetic paths rather than failing to start.

# ---------------------------------------------------------------------------
# Shared network — all services communicate over this bridge
# ---------------------------------------------------------------------------
networks:
  erp_rag_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Named volumes — survive container restarts
# ---------------------------------------------------------------------------
volumes:
  # Uploads land on the API container and are read by the worker. Without a
  # shared volume the worker looks on its own disk and finds nothing, which is
  # the B-4 storage-key failure reproduced at the container boundary. A real
  # object store (MinIO) removes the need for this.
  asset_data:
  mongodb_data:
  milvus_data:
  etcd_data:
  minio_data:
  redis_data:
  prometheus_data:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # --------------------------------------------------------------------------
  # FastAPI application
  # --------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: erp_rag_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false
    # Only the values that must differ inside the network. Everything else —
    # GEMINI_API_KEY, NGROK_*, JWT_*, ERP_PG_*, MINIO_* — arrives from
    # ../.env via env_file above. Listing them here as ${VAR} would be worse
    # than useless: Compose substitutes those against a .env next to this
    # file, finds nothing, and sets them to "" — overriding the real values
    # env_file just supplied.
    environment:
      # Service names, not localhost.
      MONGODB_URI: mongodb://mongodb:27017
      # Deliberately MILVUS_DB_URI, not MILVUS_URI: pymilvus claims that name
      # at import and rejects anything that is not an http[s] address.
      MILVUS_DB_URI: http://milvus:19530
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      ASSET_STORAGE_PATH: /var/lib/erp_rag/assets
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    volumes:
      - asset_data:/var/lib/erp_rag/assets
    networks:
      - erp_rag_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # Celery worker
  # --------------------------------------------------------------------------
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: erp_rag_worker
    restart: unless-stopped
    command: celery -A src.infrastructure.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - path: ../.env
        required: false
    # Only the values that must differ inside the network. Everything else —
    # GEMINI_API_KEY, NGROK_*, JWT_*, ERP_PG_*, MINIO_* — arrives from
    # ../.env via env_file above. Listing them here as ${VAR} would be worse
    # than useless: Compose substitutes those against a .env next to this
    # file, finds nothing, and sets them to "" — overriding the real values
    # env_file just supplied.
    environment:
      # Service names, not localhost.
      MONGODB_URI: mongodb://mongodb:27017
      # Deliberately MILVUS_DB_URI, not MILVUS_URI: pymilvus claims that name
      # at import and rejects anything that is not an http[s] address.
      MILVUS_DB_URI: http://milvus:19530
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      ASSET_STORAGE_PATH: /var/lib/erp_rag/assets
    depends_on:
      - redis
      - mongodb
    volumes:
      - asset_data:/var/lib/erp_rag/assets
    networks:
      - erp_rag_net

  # --------------------------------------------------------------------------
  # MongoDB — primary document store
  # --------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: erp_rag_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - erp_rag_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # etcd — required metadata store for Milvus
  # --------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: erp_rag_etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: >
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd-data
    volumes:
      - etcd_data:/etcd-data
    networks:
      - erp_rag_net

  # --------------------------------------------------------------------------
  # Milvus — vector store for RAG embeddings
  # --------------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: erp_rag_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - erp_rag_net

  # --------------------------------------------------------------------------
  # MinIO — S3-compatible asset storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: erp_rag_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO console
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minio_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - erp_rag_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------------------
  # Redis — Celery broker and result backend
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: erp_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp_rag_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Prometheus — scrapes /metrics from the FastAPI app
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: erp_rag_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - app
    networks:
      - erp_rag_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
